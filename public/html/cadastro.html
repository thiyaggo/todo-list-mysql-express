<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/cadastro.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <title>Cadastro</title>
</head>
<body>
    <header class="cabeca">
        <h1><i class="fa-regular fa-face-smile"></i>Bem vindo</h1>
        <div class="navegacao">
            <ul>
                <li><a href="/html/home.html"><i class="fa-solid fa-house-chimney"></i>Home</i></a></li>          
            </ul>
        </div>
        <div class="navegacao">
            <ul>
                <li><a href="/html/index.html"><i class="fa-solid fa-arrow-right-from-bracket"></i>Acessar Tarefas</a></li>           
            </ul>
        </div>
    </header>
     <main>
        <div class="main-form">
            <form id="formCadastro">
                <h1>Cadastro</h1>
                <div class="div-input">
                    <input type="text" id="nome" name="nome" placeholder="Nome completo">
                    <i class="fa-solid fa-circle-user"></i>
                </div>
                <div class="div-input">
                    <input type="email" id="email" name="email" placeholder="e-mail">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div class="div-input">
                    <input type="password" id="senha" name="senha" id="senha" placeholder="senha">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <div class="div-label">
                    <label>
                        <input type="checkbox" id="verSenha">Mostrar senha
                    </label>
                </div>
                <button type="submit" value="cadastro">Cadastrar</button>
                <div class="div-p">
                    <p>Já tem conta.<a href="/html/index.html">Voltar ao login</a></p>
                </div>
            </form>
        </div>
   </main>  
    <footer>
        <p>© 2026 - Todos os direitos reservados</p>
    </footer>
    <script  type="module">
        import { mostrarErro, mostrarSucesso, mostrarAlert } from '/js/alerts.js'; 

        document.getElementById('formCadastro').addEventListener('submit', async (e) => {
            e.preventDefault(); // impede recarregar a página
            
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (!nome.trim() || !email.trim() || !senha.trim()) {
                mostrarAlert('Preencha todos os campos.');
                return; // Para a execução e não faz o fetch
            }   
            
            try{
                 const res = await fetch('/api/cadastro', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ nome, email, senha })
                });

                const data = await res.json();

                if (!res.ok) {
                    mostrarErro(data.erro);
                    return;
                }
                window.location.href = '/html/index.html?cadastro=true';
            
            }catch(err){
                console.error(err);
                mostrarErro('Erro ao conectar com o servidor.');
            }
           
        });
        // mostrar senha
        const inputSenha = document.getElementById('senha');
        const checkbox = document.getElementById('verSenha');

        checkbox.addEventListener('change', () => {
            if (checkbox.checked) {
                inputSenha.type = 'text'; // mostra
            } else {
                inputSenha.type = 'password'; // esconde
            }
        });

    </script>
</body>
</html>
